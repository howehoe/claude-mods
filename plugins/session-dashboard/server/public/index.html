<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sessions</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f1e1c">
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --waiting: #d9480f; --waiting-bg: #fff1e8;
    --working: #1c7ed6; --working-bg: #e7f3ff;
    --stalled: #ae3ec9; --stalled-bg: #f8eefc;
    --idle: #868e96; --idle-bg: #f1f3f5;
    --done: #2f9e9e; --done-bg: #e6f7f7;
    --ok: #2b8a3e; --ok-bg: #ebfbee; --late: #e03131;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ececea; --muted: #9a9a94; --line: #33332f;
      --waiting: #ff8a4c; --waiting-bg: #3a2318;
      --working: #5aa9f0; --working-bg: #16283a;
      --stalled: #d68cf0; --stalled-bg: #2f1c36;
      --idle: #9aa1a8; --idle-bg: #2a2c2e;
      --done: #63d3d3; --done-bg: #173030;
      --ok: #69db7c; --ok-bg: #18301d; --late: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .counts { display: flex; gap: 8px; color: var(--muted); font-size: 13px; }
  .counts b { color: var(--text); }
  .spacer { flex: 1; }
  .conn { font-size: 12px; color: var(--muted); }
  .conn.down { color: var(--late); }
  #sound { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  main { padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--idle); }
  .card.waiting { border-left-color: var(--waiting); }
  .card.working { border-left-color: var(--working); }
  .card.stalled { border-left-color: var(--stalled); }
  .card.done { border-left-color: var(--done); }
  .card.ended { opacity: .55; }
  .top { display: flex; align-items: flex-start; gap: 8px; }
  .project { font-weight: 600; word-break: break-all; flex: 1; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
  .badge.waiting { color: var(--waiting); background: var(--waiting-bg); }
  .badge.working { color: var(--working); background: var(--working-bg); }
  .badge.stalled { color: var(--stalled); background: var(--stalled-bg); }
  .badge.done { color: var(--done); background: var(--done-bg); }
  .badge.idle, .badge.ended { color: var(--idle); background: var(--idle-bg); }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .summary { font-size: 14px; overflow-wrap: anywhere; }
  .summary.fallback { color: var(--muted); }
  .ask { font-size: 12px; color: var(--waiting); background: var(--waiting-bg); border-radius: 6px; padding: 4px 8px; word-break: break-all; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .meta .late { color: var(--late); font-weight: 600; }
  .tickets { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .tickets div { word-break: break-all; }
  .tickets a { color: var(--muted); }
  .pr { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; font-size: 13px; text-decoration: none; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; max-width: 100%; }
  .pr:hover { border-color: var(--muted); }
  .pr .num { font-weight: 600; white-space: nowrap; }
  .pr .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .pr .st { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 6px; white-space: nowrap; }
  .pr .st.OPEN { color: var(--ok); background: var(--ok-bg); }
  .pr .st.DRAFT { color: var(--idle); background: var(--idle-bg); }
  .pr .st.MERGED { color: var(--stalled); background: var(--stalled-bg); }
  .pr .st.CLOSED { color: var(--late); background: var(--waiting-bg); }
  .skills span { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 4px; }
  .actions { display: flex; gap: 8px; font-size: 12px; }
  .actions a { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 16px; grid-column: 1 / -1; text-align: center; }
  /* ---- メモ・TODO ---- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  aside { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  aside h3 { font-size: 12px; margin: 0 0 4px; color: var(--muted); font-weight: 600; }
  .daynav { display: flex; align-items: center; gap: 4px; }
  .daynav .day { flex: 1; font-weight: 600; }
  button.small { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 12px; }
  button.small:disabled { opacity: .4; cursor: default; }
  .todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .todos li { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; }
  .todos li input { margin-top: 3px; }
  .todos li .txt { flex: 1; overflow-wrap: anywhere; }
  .todos li.done .txt { color: var(--muted); text-decoration: line-through; }
  .todos li .from { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .todos li .del { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; visibility: hidden; }
  .todos li:hover .del { visibility: visible; }
  .todos .none { color: var(--muted); font-size: 12px; }
  .add { display: flex; gap: 4px; margin: 4px 0 0; }
  .add input { flex: 1; min-width: 0; }
  input.text, textarea.memo { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  textarea.memo { width: 100%; resize: vertical; min-height: 64px; display: block; }
  .saved { font-size: 11px; color: var(--muted); min-height: 1em; }
  .saved.err { color: var(--late); }
  details.notes-box { border-top: 1px dashed var(--line); padding-top: 4px; font-size: 13px; }
  details.notes-box > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.notes-box[open] > summary { margin-bottom: 4px; }
  details.notes-box .body { display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-left: 0; border-bottom: 1px solid var(--line); order: -1; }
  }
  @media (max-width: 400px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Claude Sessions</h1>
  <div class="counts" id="counts"></div>
  <div class="spacer"></div>
  <button id="sound" type="button">🔇 クリックで通知音を有効化</button>
  <span class="conn" id="conn">サーバーに接続しています…</span>
</header>
<div class="layout">
<main id="list"><div class="empty">読み込み中…</div></main>
<aside>
  <div class="daynav">
    <span>📝</span>
    <button class="small" type="button" id="prevDay" title="前の日">◀</button>
    <span class="day" id="dayLabel"></span>
    <button class="small" type="button" id="nextDay" title="次の日">▶</button>
    <button class="small" type="button" id="toToday">今日</button>
  </div>
  <section id="openSection">
    <h3>やること</h3>
    <ul class="todos" id="openTodos"></ul>
    <form class="add" data-session=""><input class="text" maxlength="500" placeholder="TODO を追加（Enter）"><button class="small">追加</button></form>
  </section>
  <section>
    <h3 id="doneTitle">やったこと</h3>
    <ul class="todos" id="doneTodos"></ul>
  </section>
</aside>
</div>

<script>
  const LATE_MS = 30 * 60 * 1000; // 返事待ちがこれを超えたら赤くする
  const LABEL = { waiting: '返事待ち', done: '指示待ち', working: '作業中', stalled: '応答なし', idle: '待機', ended: '終了' };
  const REASON = { permission: '実行許可', question: '質問' };
  const PR_STATE = { OPEN: 'Open', DRAFT: 'Draft', MERGED: 'Merged', CLOSED: 'Closed' };

  let sessions = [];
  let prevStatus = null; // sessionId -> status（初回は鳴らさない）

  // ---- 通知音（Web Audio API） ----
  let audio = null;
  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', async () => {
    audio = audio || new AudioContext();
    await audio.resume();
    soundBtn.textContent = '🔔 通知音 ON';
    beep();
  });
  // 返事待ちは高い 2 音、指示待ちは低い 1 音
  function beep(kind = 'waiting') {
    if (!audio || audio.state !== 'running') return;
    const t = audio.currentTime;
    const notes = kind === 'waiting' ? [880, 1320] : [660];
    notes.forEach((freq, i) => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.0001, t + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.25, t + i * 0.15 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.15 + 0.25);
      osc.connect(gain).connect(audio.destination);
      osc.start(t + i * 0.15);
      osc.stop(t + i * 0.15 + 0.3);
    });
  }

  // ---- 描画 ----
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }
  function ago(iso) {
    const ms = Date.now() - Date.parse(iso);
    const m = Math.floor(ms / 60000);
    if (m < 1) return 'たった今';
    if (m < 60) return `${m}分`;
    const h = Math.floor(m / 60);
    return `${h}時間${m % 60}分`;
  }

  // チケット名（URL）の形式で並べる。名前が取れていなければ URL だけ
  function ticketList(tickets) {
    const list = (tickets ?? []).filter((t) => /^https:\/\//.test(t.url));
    if (!list.length) return '';
    return `<div class="tickets">${list.map((t) => {
      const link = `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.url)}</a>`;
      return `<div>🎫 ${t.title ? `${esc(t.title)}（${link}）` : link}</div>`;
    }).join('')}</div>`;
  }

  function prLink(pr) {
    // gh が返す URL 以外のスキームは出さない
    if (!pr || !/^https:\/\//.test(pr.url)) return '';
    return `<a class="pr" href="${esc(pr.url)}" target="_blank" rel="noopener" title="${esc(pr.title)}">
      <span class="num">PR #${esc(pr.number)}</span>
      <span class="st ${esc(pr.state)}">${PR_STATE[pr.state] ?? esc(pr.state)}</span>
      <span class="title">${esc(pr.title)}</span>
    </a>`;
  }

  function render() {
    const list = document.getElementById('list');
    const counts = { waiting: 0, done: 0, working: 0, stalled: 0 };
    sessions.forEach((s) => { if (s.status in counts) counts[s.status]++; });
    document.getElementById('counts').innerHTML =
      `<span>返事待ち <b>${counts.waiting}</b></span><span>指示待ち <b>${counts.done}</b></span><span>作業中 <b>${counts.working}</b></span><span>応答なし <b>${counts.stalled}</b></span>`;
    document.title = counts.waiting ? `(${counts.waiting}) Claude Sessions` : 'Claude Sessions';

    // カードは作り直さず中身だけ差し替える（メモ・TODO の入力中に消えないように）
    const ids = new Set(sessions.map((s) => s.sessionId));
    for (const [id, c] of cards) if (!ids.has(id)) { c.el.remove(); cards.delete(id); }
    if (!sessions.length) {
      list.innerHTML = '<div class="empty">表示するセッションがありません。<br>session-dashboard プラグインを入れた後に起動したセッションが、ここに表示されます。</div>';
      return;
    }
    list.querySelector(':scope > .empty')?.remove();
    for (const s of sessions) {
      const c = cards.get(s.sessionId) ?? createCard(s);
      c.el.className = `card ${s.status}`;
      c.info.innerHTML = cardInfo(s);
      c.project = s.project;
    }
    // 並び順が変わったときだけ並べ替える。動かすとフォーカスが外れるので戻す
    const desired = sessions.map((s) => cards.get(s.sessionId).el);
    const current = [...list.children];
    if (desired.some((el, i) => current[i] !== el)) {
      const active = document.activeElement;
      const sel = active && typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd] : null;
      list.append(...desired);
      if (active && active !== document.activeElement && active.isConnected) {
        active.focus({ preventScroll: true });
        if (sel) active.setSelectionRange(...sel);
      }
    }
    renderNotes();
  }

  function cardInfo(s) {
      const since = Date.now() - Date.parse(s.statusSince);
      const late = s.status === 'waiting' && since > LATE_MS;
      const reason = s.waitingReason && REASON[s.waitingReason] ? `（${REASON[s.waitingReason]}）` : '';
      const summary = s.summary
        ? `<div class="summary">${esc(s.summary)}</div>`
        : `<div class="summary fallback">${esc(s.lastPrompt || '（まだ発言がありません）')}</div>`;
      const git = s.git ? `<span>⎇ ${esc(s.git.branch)}${s.git.dirty ? ` ・未コミット ${s.git.dirty}` : ''}</span>` : '';
      const skills = s.recentSkills?.length
        ? `<span class="skills">${s.recentSkills.map((k) => `<span>${esc(k)}</span>`).join('')}</span>` : '';
      const closable = s.closable ? '<span class="badge ok">閉じてよい</span>' : '';
      const vscode = s.cwd ? `<a href="vscode://file${encodeURI(s.cwd)}">VSCode で開く</a>` : '';
      return `
        <div class="top">
          <div class="project">${esc(s.project)}</div>
          ${closable}
          <span class="badge ${s.status}">${LABEL[s.status]}${reason}</span>
        </div>
        ${summary}
        ${s.lastAssistantTail ? `<div class="ask">💬 ${esc(s.lastAssistantTail)}</div>` : ''}
        ${ticketList(s.tickets)}
        ${prLink(s.pr)}
        <div class="meta">
          <span class="${late ? 'late' : ''}">${LABEL[s.status]} ${ago(s.statusSince)}</span>
          ${git}
          ${skills}
        </div>
        <div class="actions">${vscode}<span title="${esc(s.sessionId)}">${esc(s.sessionId.slice(0, 8))}</span></div>`;
  }

  // ---- メモ・TODO ----
  let notes = { todos: [], sessionMemos: {} };
  let notesLoaded = false;
  const cards = new Map(); // sessionId -> { el, info, box, todos, memo, saved, project }
  const dayKey = (d) => d.toLocaleDateString('sv-SE'); // ローカル日付の YYYY-MM-DD
  let viewDay = dayKey(new Date());

  function createCard(s) {
    const el = document.createElement('article');
    el.innerHTML = `<div class="info" style="display:contents"></div>
      <details class="notes-box">
        <summary></summary>
        <div class="body">
          <ul class="todos"></ul>
          <form class="add"><input class="text" maxlength="500" placeholder="このセッションの TODO（Enter）"><button class="small">追加</button></form>
          <textarea class="memo" placeholder="このセッションのメモ（自動で保存）"></textarea>
          <div class="saved"></div>
        </div>
      </details>`;
    const c = {
      el,
      info: el.querySelector('.info'),
      box: el.querySelector('details'),
      summary: el.querySelector('summary'),
      todos: el.querySelector('.todos'),
      memo: el.querySelector('textarea'),
      saved: el.querySelector('.saved'),
      project: s.project,
      opened: false,
    };
    el.querySelector('form').dataset.session = s.sessionId;
    c.memo.dataset.session = s.sessionId;
    cards.set(s.sessionId, c);
    return c;
  }

  function todoItem(t, { from = false } = {}) {
    const label = from && t.project ? `<span class="from" title="${esc(t.project)}">${esc(t.project)}</span>` : '';
    return `<li class="${t.done ? 'done' : ''}" data-id="${esc(t.id)}">
      <input type="checkbox" class="check" ${t.done ? 'checked' : ''}>
      <span class="txt" title="ダブルクリックで編集">${esc(t.text)}</span>${label}
      <button type="button" class="del" title="削除">×</button>
    </li>`;
  }

  // 入力中・保存待ちのメモは上書きしない
  function setMemo(ta, text) {
    if (document.activeElement === ta || pending.has(memoKey(ta))) return;
    if (ta.value !== text) ta.value = text;
  }

  function renderNotes() {
    if (!notesLoaded) return;
    for (const [id, c] of cards) {
      const todos = notes.todos.filter((t) => t.sessionId === id);
      // 未完了を先、完了は新しい順に後ろへ
      todos.sort((a, b) => (a.done - b.done) || (a.done ? (b.doneAt ?? '').localeCompare(a.doneAt ?? '') : 0));
      const memo = notes.sessionMemos[id]?.text ?? '';
      const open = todos.filter((t) => !t.done).length;
      c.summary.textContent = `📝 メモ・TODO${open ? `（未完了 ${open}）` : ''}${memo.trim() ? '・メモあり' : ''}`;
      c.todos.innerHTML = todos.map((t) => todoItem(t)).join('');
      setMemo(c.memo, memo);
      // 中身があるカードは最初だけ開いておく
      if (!c.opened) { c.opened = true; if (open || memo.trim()) c.box.open = true; }
    }

    const today = dayKey(new Date());
    const isToday = viewDay === today;
    document.getElementById('dayLabel').textContent = isToday ? `今日（${viewDay.slice(5).replace('-', '/')}）` : viewDay.replace(/-/g, '/');
    document.getElementById('nextDay').disabled = isToday;
    document.getElementById('toToday').disabled = isToday;

    // やること: 全体の TODO を先に、セッションの TODO は作業名を添えて（今日を表示しているときだけ）
    document.getElementById('openSection').hidden = !isToday;
    const open = notes.todos.filter((t) => !t.done).sort((a, b) => (a.sessionId ? 1 : 0) - (b.sessionId ? 1 : 0));
    document.getElementById('openTodos').innerHTML =
      open.map((t) => todoItem(t, { from: true })).join('') || '<li class="none">やることはありません</li>';

    const done = notes.todos.filter((t) => t.done && t.doneAt && dayKey(new Date(t.doneAt)) === viewDay)
      .sort((a, b) => a.doneAt.localeCompare(b.doneAt));
    document.getElementById('doneTitle').textContent = `やったこと（${done.length}）`;
    document.getElementById('doneTodos').innerHTML =
      done.map((t) => todoItem(t, { from: true })).join('') || '<li class="none">まだありません</li>';
  }

  async function postNote(op) {
    const res = await fetch('/api/notes', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(op),
      keepalive: true,
    });
    if (!res.ok) throw new Error(`保存に失敗しました（${res.status}）`);
  }

  // 失敗はその場に出す（メモ欄があればそこ、なければ alert）
  async function send(op, savedEl = null) {
    try {
      await postNote(op);
      if (savedEl) { savedEl.textContent = `保存しました ${new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`; savedEl.classList.remove('err'); }
      return true;
    } catch (e) {
      if (savedEl) { savedEl.textContent = e.message; savedEl.classList.add('err'); } else alert(e.message);
      return false;
    }
  }

  // メモは打ち終わって 0.8 秒後、またはフォーカスが外れたときに保存する
  const pending = new Map(); // key -> { timer, op, savedEl }
  const memoKey = (ta) => ta.dataset.session;
  function memoSavedEl(ta) { return ta.nextElementSibling; }
  function scheduleMemo(ta) {
    const key = memoKey(ta);
    clearTimeout(pending.get(key)?.timer);
    const op = { type: 'setSessionMemo', sessionId: ta.dataset.session, project: cards.get(ta.dataset.session)?.project ?? '', text: ta.value };
    const savedEl = memoSavedEl(ta);
    savedEl.textContent = '入力中…';
    savedEl.classList.remove('err');
    pending.set(key, { timer: setTimeout(() => flushMemo(key), 800), op, savedEl });
  }
  async function flushMemo(key) {
    const p = pending.get(key);
    if (!p) return;
    clearTimeout(p.timer);
    const ok = await send(p.op, p.savedEl);
    // 送っている間に打ち直されていなければ待ちを外す
    if (pending.get(key) === p) pending.delete(key);
    if (ok) renderNotes();
  }

  document.addEventListener('input', (e) => {
    if (e.target.matches('textarea.memo')) scheduleMemo(e.target);
  });
  document.addEventListener('focusout', (e) => {
    if (e.target.matches('textarea.memo')) flushMemo(memoKey(e.target));
  });
  window.addEventListener('pagehide', () => { for (const key of pending.keys()) flushMemo(key); });

  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('form.add');
    if (!form) return;
    e.preventDefault();
    const input = form.querySelector('input');
    const text = input.value.trim();
    if (!text) return;
    const sessionId = form.dataset.session || null;
    const op = { type: 'addTodo', text, sessionId, project: sessionId ? cards.get(sessionId)?.project ?? '' : '' };
    if (await send(op)) input.value = '';
  });

  document.addEventListener('change', (e) => {
    if (!e.target.matches('.todos .check')) return;
    send({ type: 'updateTodo', id: e.target.closest('li').dataset.id, done: e.target.checked });
  });

  document.addEventListener('click', (e) => {
    const del = e.target.closest('.todos .del');
    if (!del) return;
    const li = del.closest('li');
    if (confirm(`「${li.querySelector('.txt').textContent}」を削除しますか？`)) send({ type: 'deleteTodo', id: li.dataset.id });
  });

  document.addEventListener('dblclick', (e) => {
    const txt = e.target.closest('.todos .txt');
    if (!txt) return;
    const text = prompt('TODO を編集', txt.textContent);
    if (text != null && text.trim() && text.trim() !== txt.textContent) {
      send({ type: 'updateTodo', id: txt.closest('li').dataset.id, text });
    }
  });

  function moveDay(delta) {
    const [y, m, d] = viewDay.split('-').map(Number);
    viewDay = dayKey(new Date(y, m - 1, d + delta));
    renderNotes();
  }
  document.getElementById('prevDay').addEventListener('click', () => moveDay(-1));
  document.getElementById('nextDay').addEventListener('click', () => moveDay(1));
  document.getElementById('toToday').addEventListener('click', () => { viewDay = dayKey(new Date()); renderNotes(); });

  function onNotes(next) {
    notes = next;
    notesLoaded = true;
    renderNotes();
  }

  function onSnapshot(snap) {
    sessions = snap.sessions;
    const next = Object.fromEntries(sessions.map((s) => [s.sessionId, s.status]));
    if (prevStatus) {
      // 返事待ち・指示待ちに変わったセッションがあれば 1 回だけ鳴らす（返事待ちを優先）
      const turned = (st) => sessions.some((s) => s.status === st && prevStatus[s.sessionId] !== st);
      if (turned('waiting')) beep('waiting');
      else if (turned('done')) beep('done');
    }
    prevStatus = next;
    render();
  }

  // ---- SSE ----
  const conn = document.getElementById('conn');
  const es = new EventSource('/events');
  es.onopen = () => { conn.textContent = '● 接続済み'; conn.classList.remove('down'); };
  es.onerror = () => { conn.textContent = '切断（再接続中）'; conn.classList.add('down'); };
  es.onmessage = (ev) => onSnapshot(JSON.parse(ev.data));
  es.addEventListener('notes', (ev) => onNotes(JSON.parse(ev.data)));

  // 経過時間の表示を進める
  setInterval(render, 30 * 1000);
</script>
</body>
</html>
